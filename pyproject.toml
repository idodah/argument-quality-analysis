[project]
name = "argument-quality-analysis"
version = "0.1.0"
description = "Research codebase on argument persuasiveness on Reddit r/changemyview: pair-wise dataset, TF-IDF/LLM/Qwen rankers, and a LangGraph RAG refinement agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bitsandbytes>=0.49.2",
    "convokit>=4.1.1",
    "datasets>=4.8.5",
    "dotenv>=0.9.9",
    "langchain>=1.3.1",
    "langchain-community>=0.3.0",
    "langchain-chroma>=0.2.0",
    "langchain-openai>=1.2.1",
    "langgraph>=1.2.0",
    "langsmith>=0.1.0",
    "mcp>=1.2.0",
    "gradio>=6.0.0",
    "wandb>=0.17.0",
    "chromadb>=0.5.0",
    "tavily-python>=0.5.0",
    "openai>=2.36.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "peft>=0.19.1",
    "praw>=7.7.0",
    "requests>=2.31.0",
    "tiktoken>=0.12.0",
    "together>=2.12.0",
    "xgboost>=3.2.0",
    "zenodo-get>=3.0.0",
    "weave>=0.52.41",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "pypdf>=6.12.2",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
